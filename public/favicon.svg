<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64" fill="none">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="80" y2="64">
      <stop offset="0%" stop-color="#65D66A"/>
      <stop offset="45%" stop-color="#2E9E43"/>
      <stop offset="100%" stop-color="#17652D"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="skewX(-10)">
    <text
      x="5"
      y="51"
      font-family="Arial Black, Arial, sans-serif"
      font-size="53"
      font-weight="900"
      font-style="italic"
      letter-spacing="-9"
      fill="url(#green)"
    >WH</text>

    <text
      x="5"
      y="51"
      font-family="Arial Black, Arial, sans-serif"
      font-size="53"
      font-weight="900"
      font-style="italic"
      letter-spacing="-9"
      fill="url(#shine)"
    >WH</text>
  </g>
</svg>
